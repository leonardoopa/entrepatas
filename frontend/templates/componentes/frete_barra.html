<div class="frete-barra{% if resumo.frete_gratis %} frete-barra--ok{% endif %}">
  <p>
    {% if resumo.frete_gratis %}🎉 Você ganhou <strong>frete grátis</strong>!
    {% else %}🚚 Faltam <strong>R$ {{ resumo.falta_para_frete_gratis|floatformat:"2g" }}</strong> para ganhar frete grátis.{% endif %}
  </p>
  <div class="frete-barra__trilho"><div class="frete-barra__preench" style="width:{{ resumo.progresso_frete }}%"></div></div>
</div>
